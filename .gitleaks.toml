# Gitleaks configuration.
#
# The default rule set stays fully enabled: nothing is disabled, no directory
# is skipped, and no rule is relaxed. The two allowlists below cover known
# non-secret identifiers that the entropy-based `generic-api-key` rule reads
# as key=value pairs. Each one is bound to a single file AND a regex for the
# exact identifier shape, so it cannot hide a real secret elsewhere.
#
# They are needed for the Git history scan: the working tree no longer
# contains these shapes, but earlier commits of the hardening branch do.
#
# They are attached to the `generic-api-key` rule, not declared as global
# [[allowlists]]: gitleaks 8.28.0 `dir` scans skip a file outright when its
# path matches a global allowlist, ignoring `condition = "AND"`, so the two
# files were not scanned for any rule. A rule allowlist is checked per
# finding with both conditions. Redeclaring the rule by id only extends the
# default rule; its regex, entropy and own allowlists stay as they are.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Audit hunter identifiers in the Audit 3 skill-coverage table (e.g. r3-h-auth-session)"
condition = "AND"
paths = ['''^security-audit/SKILL-COVERAGE\.md$''']
regexes = ['''^r3-[a-z0-9-]+$''']

[[rules.allowlists]]
description = "Dummy analytics filter id used by the audit-detail regression test"
condition = "AND"
paths = ['''^backend/tests/test_preprod_audit_detail\.py$''']
regexes = ['''^department_id=[A-Za-z0-9_-]{1,64}$''']
