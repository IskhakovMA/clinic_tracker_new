name: Fast Track F3 Chromium

on:
  push:
    branches: [feature/fast-track-f3-registry-stage35]

permissions:
  contents: read

concurrency:
  group: fast-track-f3-${{ github.ref }}
  cancel-in-progress: true

env:
  F2_SHA: f255c279212a5c1d8e44b22b904238cb4d32381f
  F2_TREE: b150cdeb41d0c104436e621a8234bb7af9d0bcc8

jobs:
  f3-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact F3 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check Git tree and protect existing medical contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "$F2_SHA^{tree}")" = "$F2_TREE"
          test "$(git rev-list --parents -n1 HEAD)" = "$GITHUB_SHA $F2_SHA"
          git diff --exit-code "$F2_SHA" HEAD -- backend/app backend/migrations backend/requirements-dev.txt tools/tests/wp_h/package-lock.json .github/workflows/ci.yml .github/workflows/fast-track-f2-browser.yml
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/fast-track-f3-browser.yml|backend/tests/test_frontend_csp.py|index.html|static/app.js|static/f1-doctor.js|static/f1-management.js|static/styles.css|tools/tests/fast_track_f3/*) ;;
              *) printf 'Unexpected changed path: %s\n' "$path"; exit 1 ;;
            esac
          done < <(git diff --name-only "$F2_SHA" HEAD)
          test -z "$(git status --porcelain)"
          echo "F3_CANDIDATE=$GITHUB_SHA"
          echo "F3_TREE=$(git rev-parse "$GITHUB_SHA^{tree}")"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.18'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.5'
      - name: Install pinned synthetic test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt
          npm ci --ignore-scripts --prefix tools/tests/wp_h
          tools/tests/wp_h/node_modules/.bin/playwright install --with-deps chromium
      - name: Run F3 and affected browser regressions
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export AXE_SOURCE="$PWD/tools/tests/wp_h/node_modules/axe-core/axe.min.js"
          export PLAYWRIGHT_MODULE="$PWD/tools/tests/wp_h/node_modules/playwright"
          export BROWSER_EXECUTABLE
          BROWSER_EXECUTABLE="$(node -p 'require(process.env.PLAYWRIGHT_MODULE).chromium.executablePath()')"
          export WP_H_FULL_CHROMIUM="$BROWSER_EXECUTABLE"
          test "$(node -p 'require(process.env.PLAYWRIGHT_MODULE+"/package.json").version')" = 1.62.1
          test "$(node -p 'require(require("node:path").dirname(process.env.AXE_SOURCE)+"/package.json").version')" = 4.11.0
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          export F3_SCREENSHOTS=1
          mkdir -m 700 "$RUNNER_TEMP/f3-public"
          for suite in fast_track_f3 fast_track_f2 fast_track_f1; do
            receipt="$RUNNER_TEMP/$suite"
            printf 'F3_BROWSER_SUITE=%s\n' "$suite"
            if ! python -B "tools/tests/$suite/run.py" --out "$receipt"; then
              # Report source frames only: fixture IDs, session values and response bodies stay private.
              if test -f "$receipt/browser.local.log"; then
                grep -Eo 'fast_track_f[123]/[a-z_-]+\.(cjs|py):[0-9]+:[0-9]+' "$receipt/browser.local.log" | head -12 || true
              fi
              exit 1
            fi
            python - "$receipt/public.json" "$suite" "$(git rev-parse 'HEAD^{tree}')" <<'PYTHON'
          import json
          import os
          import sys

          with open(sys.argv[1]) as file:
              receipt = json.load(file)
          assert receipt["candidateSha"] == os.environ["GITHUB_SHA"]
          assert not receipt["dirtyCheckout"] and receipt["syntheticOnly"]
          if sys.argv[2] in {"fast_track_f2", "fast_track_f3"}:
              assert receipt["candidateTree"] == sys.argv[3]
          PYTHON
            cp "$receipt/public.json" "$RUNNER_TEMP/f3-public/$suite.json"
          done
          for scenario in navigation unknownDenial; do
            out="$RUNNER_TEMP/history-$scenario"
            if ! HISTORY_SCENARIO="$scenario" python -B tools/tests/wp_i_card/run.py --suite history --out "$out"; then
              if test -f "$out/card.log"; then
                grep -Eo 'history\.cjs:[0-9]+:[0-9]+' "$out/card.log" | head -12 || true
              fi
              exit 1
            fi
            python - "$out/history-results.json" "$scenario" "$RUNNER_TEMP/f3-public/history-$scenario.json" <<'PYTHON'
          import json
          from pathlib import Path
          import sys

          result = json.loads(Path(sys.argv[1]).read_bytes())
          expected = {"navigation": 6, "unknownDenial": 1}[sys.argv[2]]
          assert result["syntheticOnly"] is True and result["realBackend"] is True
          assert result["phase"] == "complete" and len(result["check"]) == expected
          Path(sys.argv[3]).write_text(json.dumps({"scenario": sys.argv[2], "groups": expected, "result": "PASS"}) + "\n")
          PYTHON
          done
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
      - name: Retain sanitized machine receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fast-track-f3-browser-${{ github.sha }}
          path: ${{ runner.temp }}/f3-public/*.json
          if-no-files-found: error
          retention-days: 14
