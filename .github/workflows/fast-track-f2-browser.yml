name: Fast Track F2 Chromium

on:
  push:
    branches: [feature/fast-track-f2-actionable-routes]

permissions:
  contents: read

concurrency:
  group: fast-track-f2-${{ github.ref }}
  cancel-in-progress: true

env:
  F1_SHA: 0fae327791b8f9379d8870f5afe76c5dbaa44338
  F1_TREE: f680c574d3c4ab389a098a6bed75e09da542ef58

jobs:
  f2-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact F2 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check Git tree and protect existing medical contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "$F1_SHA^{tree}")" = "$F1_TREE"
          git merge-base --is-ancestor "$F1_SHA" HEAD
          git diff --exit-code "$F1_SHA" HEAD -- backend/app backend/migrations backend/requirements-dev.txt tools/tests/wp_h/package-lock.json .github/workflows/ci.yml
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/fast-track-f2-browser.yml|backend/tests/test_frontend_csp.py|index.html|static/app.js|static/f1-doctor.js|static/f1-management.js|static/styles.css|tools/tests/fast_track_f2/*) ;;
              *) printf 'Unexpected changed path: %s\n' "$path"; exit 1 ;;
            esac
          done < <(git diff --name-only "$F1_SHA" HEAD)
          test -z "$(git status --porcelain)"
          echo "F2_CANDIDATE=$GITHUB_SHA"
          echo "F2_TREE=$(git rev-parse "$GITHUB_SHA^{tree}")"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.18'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.5'
      - name: Install pinned synthetic test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt
          npm ci --ignore-scripts --prefix tools/tests/wp_h
          tools/tests/wp_h/node_modules/.bin/playwright install --with-deps chromium
      - name: Run F2 workflows and F1 browser regression
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export AXE_SOURCE="$PWD/tools/tests/wp_h/node_modules/axe-core/axe.min.js"
          export PLAYWRIGHT_MODULE="$PWD/tools/tests/wp_h/node_modules/playwright"
          export BROWSER_EXECUTABLE
          BROWSER_EXECUTABLE="$(node -p 'require(process.env.PLAYWRIGHT_MODULE).chromium.executablePath()')"
          export WP_H_FULL_CHROMIUM="$BROWSER_EXECUTABLE"
          test "$(node -p 'require(process.env.PLAYWRIGHT_MODULE+"/package.json").version')" = 1.62.1
          test "$(node -p 'require(require("node:path").dirname(process.env.AXE_SOURCE)+"/package.json").version')" = 4.11.0
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          export F2_SCREENSHOTS=1
          mkdir -m 700 "$RUNNER_TEMP/f2-public"
          for suite in fast_track_f2 fast_track_f1; do
            receipt="$RUNNER_TEMP/$suite"
            printf 'F2_BROWSER_SUITE=%s\n' "$suite"
            if ! python -B "tools/tests/$suite/run.py" --out "$receipt"; then
              # Report source frames only: fixture IDs, session values and response bodies stay private.
              if test -f "$receipt/browser.local.log"; then
                grep -Eo 'fast_track_f[12]/[a-z_-]+\.(cjs|py):[0-9]+:[0-9]+' "$receipt/browser.local.log" | head -12 || true
              fi
              exit 1
            fi
            python - "$receipt/public.json" "$suite" "$(git rev-parse 'HEAD^{tree}')" <<'PYTHON'
          import json
          import os
          import sys

          with open(sys.argv[1]) as file:
              receipt = json.load(file)
          assert receipt["candidateSha"] == os.environ["GITHUB_SHA"]
          assert not receipt["dirtyCheckout"] and receipt["syntheticOnly"]
          if sys.argv[2] == "fast_track_f2":
              assert receipt["candidateTree"] == sys.argv[3]
          PYTHON
            cp "$receipt/public.json" "$RUNNER_TEMP/f2-public/$suite.json"
          done
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
      - name: Retain sanitized machine receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fast-track-f2-browser-${{ github.sha }}
          path: ${{ runner.temp }}/f2-public/*.json
          if-no-files-found: error
          retention-days: 14
