name: Fast Track F8 Chromium

on:
  push:
    branches: [feature/fast-track-f8-quality-workflows]

permissions:
  contents: read

concurrency:
  group: fast-track-f8-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: 071959f405323c1a01ea2c2f4ddf90061a47725d
  BASE_TREE: 2702c7364b1265ca42dd138ed16d6f2dfd4a2841

jobs:
  f8-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact F8 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check Git tree and protect existing medical contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "$BASE_SHA^{tree}")" = "$BASE_TREE"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          test -z "$(git rev-list --merges "$BASE_SHA..HEAD")"
          git diff --exit-code "$BASE_SHA" HEAD -- backend/app backend/migrations backend/requirements-dev.txt tools/tests/wp_h/package-lock.json .github/workflows/ci.yml .github/workflows/fast-track-f2-browser.yml .github/workflows/fast-track-f3-browser.yml .github/workflows/fast-track-f4-browser.yml .github/workflows/fast-track-f5-browser.yml .github/workflows/fast-track-f6-browser.yml .github/workflows/fast-track-f7-browser.yml static/quality-v1.js
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/fast-track-f8-browser.yml|backend/tests/test_frontend_csp.py|index.html|static/app.js|static/styles.css|tools/tests/fast_track_f8/journey.cjs|tools/tests/fast_track_f8/run.py|tools/tests/wp_i_quality/run_browser.py) ;;
              *) printf 'Unexpected changed path: %s\n' "$path"; exit 1 ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" HEAD)
          test -z "$(git status --porcelain)"
          echo "F8_CANDIDATE=$GITHUB_SHA"
          echo "F8_TREE=$(git rev-parse "$GITHUB_SHA^{tree}")"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.18'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.5'
      - name: Install pinned synthetic test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt
          npm ci --ignore-scripts --prefix tools/tests/wp_h
          tools/tests/wp_h/node_modules/.bin/playwright install --with-deps chromium
      - name: Run F8 and affected browser regressions
        id: browser-suites
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export AXE_SOURCE="$PWD/tools/tests/wp_h/node_modules/axe-core/axe.min.js"
          export PLAYWRIGHT_MODULE="$PWD/tools/tests/wp_h/node_modules/playwright"
          export BROWSER_EXECUTABLE
          BROWSER_EXECUTABLE="$(node -p 'require(process.env.PLAYWRIGHT_MODULE).chromium.executablePath()')"
          export WP_H_FULL_CHROMIUM="$BROWSER_EXECUTABLE"
          test "$(node -p 'require(process.env.PLAYWRIGHT_MODULE+"/package.json").version')" = 1.62.1
          test "$(node -p 'require(require("node:path").dirname(process.env.AXE_SOURCE)+"/package.json").version')" = 4.11.0
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -m 700 "$RUNNER_TEMP/f8-public"
          python - "$RUNNER_TEMP" <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import platform
          import re
          import subprocess
          import sys
          import tempfile

          runner = Path(sys.argv[1])
          old_output = runner / "f8-quality-browser"
          probe = """
          const {chromium} = require(process.env.PLAYWRIGHT_MODULE);
          (async () => {
            const browser = await chromium.launch({
              executablePath: process.env.BROWSER_EXECUTABLE, headless: true, timeout: 15000,
            });
            await browser.close();
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          """
          def launch(temp):
              process = subprocess.run(["node", "-e", probe],
                  env={**os.environ, "TMPDIR": temp, "DEBUG": "pw:browser"},
                  capture_output=True, timeout=30)
              log = process.stderr
              profile = re.search(rb"--user-data-dir=([^\r\n]+?)(?= --|\r?\n|$)", log)
              socket = re.search(rb"Socket path too long:\s*([^\r\n]+)", log, re.I)
              return {
                  "exitCode": process.returncode, "tmpdirBytes": len(os.fsencode(temp)),
                  "profilePathBytes": len(profile[1]) if profile else None,
                  "socketPathBytes": len(socket[1].strip()) if socket else None,
                  "reason": "socket_path_too_long" if socket else
                      ("unclassified_launch_failure" if process.returncode else None),
              }

          old_output.mkdir(mode=0o700)
          try:
              with tempfile.TemporaryDirectory(prefix="private-fixture-", dir=old_output) as old:
                  with tempfile.TemporaryDirectory(prefix="wq.", dir="/tmp") as new:
                      long_run, short_run = launch(old), launch(new)
              assert not Path(old).exists() and not Path(new).exists()
          finally:
              old_output.rmdir()
          data = {
              "candidateSha": os.environ["GITHUB_SHA"], "platform": sys.platform,
              "architecture": platform.machine(), "sameBinary": True, "syntheticOnly": True,
              "longTmpdir": long_run, "shortTmpdir": short_run,
          }
          (runner / "f8-public/wp-i-quality-launch-probe.json").write_text(json.dumps(data, indent=2) + "\n")
          print(json.dumps(data))
          assert short_run["exitCode"] == 0, "Chromium did not launch with the short TMPDIR"
          PYTHON
          for suite in browser browser_zoom; do
            out="$RUNNER_TEMP/f8-quality-$suite"
            printf 'F8_WP_I_QUALITY_SUITE=%s\n' "$suite"
            status=0
            python -B tools/tests/wp_i_quality/run_browser.py --suite "$suite" --out "$out" || status=$?
            if test -f "$out/browser-execution.json"; then
              cp "$out/browser-execution.json" "$RUNNER_TEMP/f8-public/wp-i-quality-$suite-execution.json"
              cat "$out/browser-execution.json"
            fi
            if test "$status" -ne 0; then
              if test -f "$out/browser.local.log"; then
                grep -Eo 'wp_i_quality/[a-z_-]+\.cjs:[0-9]+:[0-9]+' "$out/browser.local.log" | head -12 || true
              fi
              exit "$status"
            fi
            python - "$suite" "$out" "$RUNNER_TEMP/f8-public/wp-i-quality-$suite.json" <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import sys

          suite, output, target = sys.argv[1:]
          source = Path(output)
          run = json.loads((source / "browser-execution.json").read_text())
          assert run["candidateSha"] == os.environ["GITHUB_SHA"]
          assert run["phase"] == "complete" and run["exitCode"] == 0
          assert run["browserTmpRemoved"] and run["fixtureTmpRemoved"] and run["browserBinaryExists"]
          assert run["platform"] == "linux" and run["tmpdirBytes"] <= 32
          if suite == "browser":
              actual = json.loads((source / "browser-results.json").read_text())
              assert actual["syntheticOnly"] and actual["realFastApi"]
              counts = {key: len(actual[key]) for key in ("checks", "roles", "faultChecks", "accessibility")}
              assert all(counts.values())
          else:
              actual = json.loads((source / "browser-native-zoom.json").read_text())
              assert actual["syntheticOnly"] and actual["nativeChromeZoom"]
              assert len(actual["samples"]) == 6 and not any(row["violations"] for row in actual["samples"])
              counts = {"nativeZoomSamples": len(actual["samples"])}
          Path(target).write_text(json.dumps({
              "suite": suite, "result": "PASS", "candidateSha": run["candidateSha"], **counts,
          }) + "\n")
          PYTHON
          done
          receipt="$RUNNER_TEMP/f8-journey"
          if ! python -B tools/tests/fast_track_f8/run.py --out "$receipt"; then
            if test -f "$receipt/browser.local.log"; then
              grep -Eo 'fast_track_f8/[a-z_-]+\.(cjs|py):[0-9]+(:[0-9]+)?' "$receipt/browser.local.log" | head -12 || true
            fi
            exit 1
          fi
          python - "$receipt/public.json" "$(git rev-parse 'HEAD^{tree}')" <<'PYTHON'
          import json
          import os
          import sys

          with open(sys.argv[1]) as file:
              receipt = json.load(file)
          assert receipt["candidateSha"] == os.environ["GITHUB_SHA"]
          assert receipt["candidateTree"] == sys.argv[2]
          assert not receipt["dirtyCheckout"] and receipt["syntheticOnly"]
          PYTHON
          cp "$receipt/public.json" "$RUNNER_TEMP/f8-public/f8-journey.json"
          receipt="$RUNNER_TEMP/f7-journey"
          if ! python -B tools/tests/fast_track_f7/run.py --out "$receipt"; then
            if test -f "$receipt/browser.local.log"; then
              grep -Eo 'fast_track_f7/[a-z_-]+\.(cjs|py):[0-9]+(:[0-9]+)?' "$receipt/browser.local.log" | head -12 || true
            fi
            exit 1
          fi
          python - "$receipt/public.json" "$(git rev-parse 'HEAD^{tree}')" <<'PYTHON'
          import json
          import os
          import sys

          with open(sys.argv[1]) as file:
              receipt = json.load(file)
          assert receipt["candidateSha"] == os.environ["GITHUB_SHA"]
          assert receipt["candidateTree"] == sys.argv[2]
          assert not receipt["dirtyCheckout"] and receipt["syntheticOnly"]
          PYTHON
          cp "$receipt/public.json" "$RUNNER_TEMP/f8-public/f7-journey.json"
          for suite in create errors workflows zoom; do
            receipt="$RUNNER_TEMP/f7-i4-$suite"
            if ! python -B tools/tests/wp_i_create/run.py --suite "$suite" --out "$receipt"; then
              if test -f "$receipt/card.log"; then
                grep -Eo 'wp_i_create/[a-z_-]+\.(cjs|py):[0-9]+(:[0-9]+)?' "$receipt/card.log" | head -12 || true
              fi
              exit 1
            fi
            python - "$suite" "$RUNNER_TEMP/f8-public/i4-$suite.json" <<'PYTHON'
          import json
          import os
          import sys
          from pathlib import Path

          Path(sys.argv[2]).write_text(json.dumps({
              "suite": sys.argv[1], "result": "PASS", "candidateSha": os.environ["GITHUB_SHA"],
          }) + "\n")
          PYTHON
          done
          for suite in journey schedule workflows loading decisions records zoom decisionzoom recordszoom; do
            receipt="$RUNNER_TEMP/f6-$suite"
            printf 'F6_BROWSER_SUITE=%s\n' "$suite"
            if ! python -B tools/tests/fast_track_f6/run.py --suite "$suite" --out "$receipt"; then
              for log in "$receipt/browser.local.log" "$receipt/card.log"; do
                if test -f "$log"; then
                  grep -Eo '(fast_track_f6|wp_i_consilium)/[a-z_-]+\.(cjs|py):[0-9]+(:[0-9]+)?' "$log" | head -12 || true
                fi
              done
              exit 1
            fi
            python - "$receipt/public.json" "$(git rev-parse 'HEAD^{tree}')" <<'PYTHON'
          import json
          import os
          import sys

          with open(sys.argv[1]) as file:
              receipt = json.load(file)
          assert receipt["candidateSha"] == os.environ["GITHUB_SHA"]
          assert receipt["candidateTree"] == sys.argv[2]
          assert not receipt["dirtyCheckout"] and receipt["syntheticOnly"]
          PYTHON
            cp "$receipt/public.json" "$RUNNER_TEMP/f8-public/f6-$suite.json"
          done
          for suite in fast_track_f5 fast_track_f4 fast_track_f3 fast_track_f2 fast_track_f1; do
            receipt="$RUNNER_TEMP/$suite"
            printf 'F6_REGRESSION_SUITE=%s\n' "$suite"
            if ! python -B "tools/tests/$suite/run.py" --out "$receipt"; then
              # Report source frames only: fixture IDs, session values and response bodies stay private.
              if test -f "$receipt/browser.local.log"; then
                grep -Eo 'fast_track_f[12345]/[a-z_-]+\.(cjs|py):[0-9]+:[0-9]+' "$receipt/browser.local.log" | head -12 || true
              fi
              exit 1
            fi
            python - "$receipt/public.json" "$suite" "$(git rev-parse 'HEAD^{tree}')" <<'PYTHON'
          import json
          import os
          import sys

          with open(sys.argv[1]) as file:
              receipt = json.load(file)
          assert receipt["candidateSha"] == os.environ["GITHUB_SHA"]
          assert not receipt["dirtyCheckout"] and receipt["syntheticOnly"]
          if sys.argv[2] in {"fast_track_f2", "fast_track_f3", "fast_track_f4", "fast_track_f5"}:
              assert receipt["candidateTree"] == sys.argv[3]
          PYTHON
            cp "$receipt/public.json" "$RUNNER_TEMP/f8-public/$suite.json"
          done
          for scenario in navigation unknownDenial; do
            out="$RUNNER_TEMP/history-$scenario"
            if ! HISTORY_SCENARIO="$scenario" python -B tools/tests/wp_i_card/run.py --suite history --out "$out"; then
              if test -f "$out/card.log"; then
                grep -Eo 'history\.cjs:[0-9]+:[0-9]+' "$out/card.log" | head -12 || true
              fi
              exit 1
            fi
            python - "$out/history-results.json" "$scenario" "$RUNNER_TEMP/f8-public/history-$scenario.json" <<'PYTHON'
          import json
          from pathlib import Path
          import sys

          result = json.loads(Path(sys.argv[1]).read_bytes())
          expected = {"navigation": 6, "unknownDenial": 1}[sys.argv[2]]
          assert result["syntheticOnly"] is True and result["realBackend"] is True
          assert result["phase"] == "complete" and len(result["check"]) == expected
          Path(sys.argv[3]).write_text(json.dumps({"scenario": sys.argv[2], "groups": expected, "result": "PASS"}) + "\n")
          PYTHON
          done
          out="$RUNNER_TEMP/inbox-fix1"
          if ! python -B tools/tests/wp_i_notifications/run.py --suite fix1 --count 1000 --out "$out"; then
            if test -f "$out/card.log"; then grep -Eo 'fix1\.cjs:[0-9]+:[0-9]+' "$out/card.log" | head -12 || true; fi
            exit 1
          fi
          python - "$out/results.json" "$RUNNER_TEMP/f8-public/notifications-fix1.json" <<'PYTHON'
          import json
          import sys
          from pathlib import Path

          result = json.loads(Path(sys.argv[1]).read_bytes())
          assert result["realBackend"] and len(result["checks"]) == 12
          Path(sys.argv[2]).write_text(json.dumps({"groups": 12, "result": "PASS"}) + "\n")
          PYTHON
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
      - name: Retain sanitized machine receipts
        if: ${{ !cancelled() && (steps.browser-suites.outcome == 'success' || steps.browser-suites.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fast-track-f8-browser-${{ github.sha }}
          path: ${{ runner.temp }}/f8-public/*.json
          if-no-files-found: error
          retention-days: 14
