name: CI

# Release gates (WP-A). Every push to the protected line (main), to integration,
# fix and feature branches, and every pull request into main or an integration
# branch runs the full set of gates; workflow_dispatch allows a manual run on any
# ref. Pull requests use the unprivileged `pull_request` event only: fork code runs
# without repository secrets and with the read-only token below. The `release-gate` job is the
# single status that must be green before a merge (see "Merge gate" in
# .github/pull_request_template.md: branch protection is not available on this plan).
on:
  pull_request:
    branches:
      - main
      - "integration/**"
  push:
    branches:
      - main
      - "integration/**"
      - "fix/**"
      - "feature/**"
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a work branch supersedes the older run; runs on main always finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Number of backend test shards; backend-tests matrix below must list 1..BACKEND_TEST_SHARDS.
  BACKEND_TEST_SHARDS: "4"

jobs:
  backend-test-plan:
    name: backend-test-plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLINIC_DEBUG: "false"
      NOTIFICATION_PROVIDER: mock
    outputs:
      count: ${{ steps.collect.outputs.count }}
      digest: ${{ steps.collect.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt

      # Collects twice (deterministic node ids), checks that the shard plan partitions
      # every test file, and exports the collection's count and SHA-256 as job outputs.
      # No artifact storage is used: the gate must not depend on the account's quota.
      - name: Collect every backend test and plan the shards
        id: collect
        run: python tools/ci/pytest_shards.py collect --shards "$BACKEND_TEST_SHARDS"

  backend-tests:
    name: backend-tests (${{ matrix.shard }}/4)
    needs: backend-test-plan
    runs-on: ubuntu-latest
    # About 7-8 minutes per shard on a hosted runner (the whole suite took ~30 minutes
    # in one job and was cancelled at 15); 25 minutes leaves room for a slow runner.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CLINIC_DATA_DIR: /tmp/clinic-ci-data-${{ github.run_id }}-${{ matrix.shard }}
      CLINIC_DEBUG: "false"
      NOTIFICATION_PROVIDER: mock
      SHARD: ${{ matrix.shard }}
      EXPECTED_COUNT: ${{ needs.backend-test-plan.outputs.count }}
      EXPECTED_DIGEST: ${{ needs.backend-test-plan.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      # The suite includes the Staff-UX prototype node tests (test_integration_preaudit);
      # node is set up explicitly so they run instead of being skipped.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt

      # No -x, -k, --ignore or --deselect: the shard runs every test of its files.
      # The shard re-collects and requires the plan job's count and digest (identical
      # collection), then proves it ran exactly its planned tests once each, all passed.
      - name: Run backend test shard
        run: |
          set -euo pipefail
          planned="$RUNNER_TEMP/planned.txt"
          outcomes="$RUNNER_TEMP/outcomes.json"
          mapfile -t files < <(python tools/ci/pytest_shards.py files --shard "$SHARD" --shards "$BACKEND_TEST_SHARDS" \
            --expect-count "$EXPECTED_COUNT" --expect-digest "$EXPECTED_DIGEST" --planned-out "$planned")
          # Without paths pytest would run its default test paths — never let an empty plan pass silently.
          if [ "${#files[@]}" -eq 0 ]; then echo "shard $SHARD has no test files" >&2; exit 1; fi
          echo "shard $SHARD/$BACKEND_TEST_SHARDS: ${#files[@]} test files, $(wc -l < "$planned") planned tests"
          status=0
          PYTEST_OUTCOMES_FILE="$outcomes" python -m pytest -q -p tools.ci.pytest_outcomes "${files[@]}" || status=$?
          python tools/ci/pytest_shards.py verify-shard --planned "$planned" --outcomes "$outcomes"
          exit "$status"

  backend-tests-verify:
    name: backend-tests-verify
    needs: [backend-test-plan, backend-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The plan job proved the shards partition the collection; every shard proved it ran
      # its planned tests on the identical collection, once each and all passed. Requiring
      # all of them to succeed therefore proves that every collected test ran once and passed.
      - name: Require the plan and every shard to have succeeded
        env:
          PLAN_RESULT: ${{ needs.backend-test-plan.result }}
          SHARDS_RESULT: ${{ needs.backend-tests.result }}
          COUNT: ${{ needs.backend-test-plan.outputs.count }}
        run: |
          echo "plan: $PLAN_RESULT; shards: $SHARDS_RESULT; collected tests: ${COUNT:-unknown}"
          if [ "$PLAN_RESULT" != "success" ] || [ "$SHARDS_RESULT" != "success" ] || [ -z "$COUNT" ]; then
            echo "backend test verification failed" >&2
            exit 1
          fi
          echo "OK: all $COUNT collected backend tests ran exactly once and passed"

  backend-smoke:
    name: backend-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLINIC_DATA_DIR: /tmp/clinic-ci-data-${{ github.run_id }}-smoke
      CLINIC_DEBUG: "false"
      NOTIFICATION_PROVIDER: mock
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt

      - name: Check temporary database
        run: |
          mkdir -p "$CLINIC_DATA_DIR"
          python - <<'PY'
          from backend.app.db import get_connection, init_db

          conn = get_connection()
          init_db(conn)
          conn.close()
          PY
          python -m backend.cli check-db

      - name: Compile Python sources
        run: python -m compileall -q backend

  frontend-security:
    name: frontend-security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLINIC_DATA_DIR: /tmp/clinic-frontend-data-${{ github.run_id }}
      CLINIC_DEBUG: "false"
      NOTIFICATION_PROVIDER: mock
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: node --check static/app.js

      - name: Run Staff-UX prototype tests
        # Explicit files: Node 22 does not accept a directory argument for --test.
        run: node --test prototype/staff-ux/tests/*.test.mjs

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt

      - name: Run frontend security tests
        run: python -m pytest backend/tests/test_frontend_csp.py backend/tests/test_xss_api.py -q

  workflow-policy:
    name: workflow-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install policy test dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 pytest==8.3.4

      - name: Validate workflow policy
        run: python -m pytest security-audit/tests -q

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit==2.7.3

      - name: Audit backend dependencies
        run: pip-audit -r backend/requirements.txt

  sast-bandit:
    name: sast-bandit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install Bandit
        run: python -m pip install --disable-pip-version-check bandit==1.8.6

      # Negative control: with the real Bandit, a reviewed statement that only moved
      # still passes, while a new injectable query or an edited reviewed one fails.
      - name: Self-test the Bandit gate
        run: python security-audit/tests/run_bandit_allowlisted.py --self-test

      - name: Run Bandit
        run: python security-audit/tests/run_bandit_allowlisted.py

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
          GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      # Negative control: the repository's own gitleaks configuration must still
      # report a fresh key in test code and the old synthetic value in a new commit.
      - name: Verify that planted secrets are detected
        run: python3 tools/ci/gitleaks_canary.py "$RUNNER_TEMP/gitleaks"

      - name: Scan working tree for secrets
        run: '"$RUNNER_TEMP/gitleaks" dir . --redact --no-banner --verbose'

      - name: Scan Git history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner --verbose'

      # The history scan above uses gitleaks' default `git log -p`, which prints
      # no patch for merge commits: a secret typed while resolving a conflict,
      # or added by hand to a clean merge, is never scanned. remerge diffs each
      # merge against Git's own automatic merge of its parents, i.e. exactly the
      # changes made in the merge commit. --log-opts replaces gitleaks' default
      # log arguments, so they are repeated unchanged.
      # Fail closed: if Git rejects the option, gitleaks logs an ERR, scans 0
      # commits and still exits 0, so the step checks for both explicitly.
      - name: Scan changes made inside merge commits for secrets
        run: |
          set -euo pipefail
          git --version
          git log -1 --diff-merges=remerge --format=%H HEAD > /dev/null
          log="$RUNNER_TEMP/gitleaks-merge-commits.log"
          "$RUNNER_TEMP/gitleaks" git . \
            --log-opts="--all --full-history --diff-filter=tuxdb --diff-merges=remerge" \
            --redact --no-banner --no-color --verbose 2>&1 | tee "$log"
          if grep -Eq '^[^ ]+ ERR ' "$log"; then
            echo "gitleaks reported an error; merge commits were not scanned" >&2
            exit 1
          fi
          grep -Eq ' [1-9][0-9]* commits scanned' "$log"

  # Single required status: green only when every gate above succeeded.
  release-gate:
    name: release-gate
    needs:
      - backend-test-plan
      - backend-tests
      - backend-tests-verify
      - backend-smoke
      - frontend-security
      - workflow-policy
      - dependency-audit
      - sast-bandit
      - secret-scan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every gate to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {name: data["result"] for name, data in needs.items() if data["result"] != "success"}
          for name, data in sorted(needs.items()):
              print(f"{name}: {data['result']}")
          if bad:
              print(f"release gate closed: {bad}", file=sys.stderr)
              sys.exit(1)
          print("release gate open: all gates succeeded")
          PY
